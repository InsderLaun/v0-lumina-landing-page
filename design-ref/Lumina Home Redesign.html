<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina — Home Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* base palette — terminal financial, dark */
    --bg: #0a0a0c;
    --bg-2: #0e0e12;
    --surface: #111116;
    --line: #1d1d24;
    --line-strong: #2a2a34;
    --text: #e8e8ec;
    --text-2: #a8a8b3;
    --text-3: #6b6b78;
    --text-4: #44444f;

    --accent: #00d4ff;        /* cyan */
    --accent-2: #8b5cf6;       /* purple, used sparingly */
    --pos: #00d48a;
    --warn: #f59e0b;
    --neg: #ef4444;

    --font-sans: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-display: 'Inter', system-ui, sans-serif;

    --pad: 80px;
    --radius: 4px;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body { min-height: 100vh; overflow-x: hidden; }

  ::selection { background: var(--accent); color: #000; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Layout container */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
  .wrap-narrow { max-width: 1080px; margin: 0 auto; padding: 0 32px; }

  /* tiny mono labels */
  .label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
  }

  .mono { font-family: var(--font-mono); }

  /* Body root applies aesthetic variants */
  body[data-aesthetic="editorial"] {
    --font-display: 'Fraunces', Georgia, serif;
  }
  body[data-aesthetic="institutional"] {
    --accent: #c9a464;       /* warm gold for institutional */
    --bg: #0a0a08;
    --bg-2: #0e0e0c;
    --surface: #121211;
  }

  body[data-mode="light"] {
    --bg: #f7f6f3;
    --bg-2: #efeee9;
    --surface: #ffffff;
    --line: #e2e0d8;
    --line-strong: #c8c5ba;
    --text: #11110d;
    --text-2: #4a4a45;
    --text-3: #7a7a72;
    --text-4: #b0b0a8;
  }

  body[data-density="compact"] { --pad: 56px; }
  body[data-density="spacious"] { --pad: 120px; }

  body[data-mono-only="true"] {
    --accent: var(--text);
  }

  /* ------------------------------------ */
  /* Top status bar                        */
  /* ------------------------------------ */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    background: color-mix(in oklab, var(--bg) 88%, transparent);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    gap: 24px;
    height: 36px;
    padding: 0 32px;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  .topbar-item { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .topbar-item b { color: var(--text); font-weight: 500; }
  .topbar-divider { color: var(--text-4); }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--pos);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--pos) 60%, transparent);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--pos) 60%, transparent); }
    70% { box-shadow: 0 0 0 6px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .ticker { color: var(--pos); }
  .ticker.neg { color: var(--neg); }

  /* ------------------------------------ */
  /* Navbar                                */
  /* ------------------------------------ */
  .nav {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky;
    top: 36px;
    z-index: 40;
    backdrop-filter: blur(12px);
    background: color-mix(in oklab, var(--bg) 92%, transparent);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 32px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
  }
  .logo-mark {
    width: 22px; height: 22px; border-radius: 2px;
    background: var(--accent);
    position: relative;
  }
  .logo-mark::after {
    content: ""; position: absolute; inset: 4px;
    background: var(--bg);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 50%, 0 100%);
  }
  body[data-mode="light"] .logo-mark::after { background: var(--bg); }

  .nav-links { display: flex; gap: 28px; font-size: 13px; color: var(--text-2); }
  .nav-links a:hover { color: var(--text); }
  .nav-cta {
    display: flex; gap: 12px; align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 16px;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius);
    transition: all .15s ease;
    border: 1px solid transparent;
  }
  .btn-ghost { color: var(--text-2); border-color: var(--line-strong); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-3); }
  .btn-primary { background: var(--accent); color: #00121a; font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); }
  body[data-aesthetic="institutional"] .btn-primary { color: #1a1408; }
  body[data-mode="light"] .btn-primary { color: #fff; }

  /* ------------------------------------ */
  /* Hero                                   */
  /* ------------------------------------ */
  .hero {
    padding: 96px 0 64px;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 80px;
    align-items: end;
  }
  .hero-eyebrow {
    display: inline-flex; gap: 10px; align-items: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-3);
    margin-bottom: 32px;
  }
  .hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); }

  .hero h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(48px, 6.4vw, 96px);
    line-height: 0.96;
    letter-spacing: -0.035em;
    margin-bottom: 24px;
    text-wrap: balance;
  }
  body[data-aesthetic="editorial"] .hero h1 { font-weight: 500; letter-spacing: -0.02em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  body[data-aesthetic="editorial"] .hero h1 em { font-style: italic; }

  .hero-sub {
    color: var(--text-2);
    font-size: 18px;
    line-height: 1.55;
    max-width: 560px;
    margin-bottom: 40px;
    text-wrap: pretty;
  }

  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-cta .btn { height: 44px; padding: 0 20px; font-size: 14px; }

  .hero-side {
    border-left: 1px solid var(--line);
    padding-left: 40px;
  }
  .hero-side-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 20px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .stat-row:last-child { border-bottom: 0; }
  .stat-row .stat-label {
    font-size: 12px; color: var(--text-3);
    font-family: var(--font-mono); letter-spacing: 0.04em;
  }
  .stat-row .stat-right {
    display: inline-flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .stat-row .stat-val {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .stat-row .stat-val.accent { color: var(--accent); }
  .stat-row .stat-delta {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--pos);
    font-variant-numeric: tabular-nums;
  }

  /* burn ticker — bottom of hero */
  .burn-feed {
    margin-top: 56px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-3);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .burn-feed-item {
    background: var(--bg);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .burn-feed-item .meta { color: var(--text-3); font-size: 11px; letter-spacing: 0.04em; }
  .burn-feed-item .v { color: var(--text); font-size: 13px; }
  .burn-feed-item.lit .v { color: var(--accent); }

  /* Section starter */
  .sec {
    padding: var(--pad) 0;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .sec-alt { background: var(--bg-2); }
  .sec-num {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .sec-num span { color: var(--accent); }
  .sec h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(32px, 4vw, 56px);
    letter-spacing: -0.025em;
    line-height: 1.0;
    text-wrap: balance;
    max-width: 900px;
    margin-bottom: 20px;
  }
  body[data-aesthetic="editorial"] .sec h2 { font-weight: 500; }
  .sec-lede {
    color: var(--text-2);
    font-size: 17px;
    line-height: 1.6;
    max-width: 640px;
    margin-bottom: 56px;
    text-wrap: pretty;
  }
  .sec p, .step p, .bond-card p, .audience p, .phase p { text-wrap: pretty; }

  /* ------------------------------------ */
  /* How it works — editorial 4-step       */
  /* ------------------------------------ */
  .steps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .step {
    padding: 36px 32px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 220px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    transition: background .2s ease;
  }
  .step:hover { background: var(--bg-2); }
  .step .step-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.12em;
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 12px;
    align-items: start;
    min-height: 32px;
  }
  .step .step-num > span:first-child { padding-top: 4px; }
  .step .step-num .glyph {
    font-family: var(--font-mono);
    font-size: 32px;
    color: var(--accent);
    font-weight: 400;
    line-height: 1;
  }
  .step h3 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-top: 24px;
  }
  .step p {
    color: var(--text-2);
    font-size: 14px;
    line-height: 1.55;
    flex: 1;
  }
  .step .step-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-3);
    border-top: 1px dashed var(--line-strong);
    padding-top: 12px;
  }

  /* ------------------------------------ */
  /* Bonds: hold / sell / split            */
  /* ------------------------------------ */
  .bonds-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 24px;
  }
  .bond-card {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-radius: var(--radius);
    transition: border-color .2s ease;
  }
  .bond-card:hover { border-color: var(--line-strong); }
  .bond-card .bond-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-3);
  }
  .bond-card h4 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .bond-card p { color: var(--text-2); font-size: 14px; line-height: 1.55; }

  /* split bar visual */
  .split-bar {
    display: flex;
    height: 32px;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--line);
    margin-top: 8px;
  }
  .split-bar .seg {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px;
    color: #00121a; font-weight: 600;
  }
  .split-bar .seg.now { background: var(--accent); }
  .split-bar .seg.later { background: var(--line-strong); color: var(--text); }

  .bond-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    column-gap: 16px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .bond-row > span:first-child { color: var(--text-3); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; text-align: left; }
  .bond-row .v { color: var(--text); font-weight: 500; text-align: right; }
  .bond-row .v.accent { color: var(--accent); }
  .bond-row .v.pos { color: var(--pos); }

  /* ------------------------------------ */
  /* Products table — bloomberg            */
  /* ------------------------------------ */
  .prod-shell {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
  }
  .prod-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .prod-head .label { color: var(--accent); }
  .prod-tabs { display: flex; gap: 6px; font-family: var(--font-mono); font-size: 11px; }
  .prod-tabs button {
    padding: 6px 10px;
    color: var(--text-3);
    border: 1px solid transparent;
    border-radius: 2px;
    letter-spacing: 0.06em;
  }
  .prod-tabs button.on { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .prod-tabs button:hover:not(.on) { color: var(--text); }

  table.prod {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  table.prod th {
    text-align: left;
    padding: 10px 20px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    font-weight: 500;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  table.prod th.r, table.prod td.r { text-align: right; }
  table.prod tr { border-bottom: 1px solid var(--line); transition: background .12s ease; cursor: pointer; }
  table.prod tr:last-child { border-bottom: 0; }
  table.prod tr:hover { background: var(--bg); }
  table.prod tr.on { background: color-mix(in oklab, var(--accent) 6%, transparent); }
  table.prod tr.on td.first { box-shadow: inset 2px 0 0 var(--accent); }
  table.prod td {
    padding: 14px 20px;
    color: var(--text);
    vertical-align: middle;
  }
  table.prod td.first { color: var(--text); font-family: var(--font-sans); font-weight: 500; font-size: 14px; }
  table.prod td.muted { color: var(--text-3); }
  table.prod td .pill {
    display: inline-block;
    padding: 2px 6px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.04em;
  }
  table.prod td .mult { color: var(--accent); font-weight: 600; }

  /* ------------------------------------ */
  /* Burn flow visual                       */
  /* ------------------------------------ */
  .flow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
  }
  .flow-diagram {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 24px 28px 28px;
    position: relative;
    overflow: hidden;
  }
  .flow-step {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    column-gap: 16px;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px dashed var(--line);
  }
  .flow-step:last-child { border-bottom: 0; }
  .flow-step .num {
    width: 28px; height: 28px;
    border: 1px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
    border-radius: 2px;
  }
  .flow-step .desc { font-size: 14px; line-height: 1.4; }
  .flow-step .desc small { display: block; color: var(--text-3); font-size: 12px; margin-top: 4px; line-height: 1.4; }
  .flow-step .amt { font-family: var(--font-mono); color: var(--text); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .flow-step.fire .num { border-color: var(--accent); color: var(--accent); }
  .flow-step.fire .amt { color: var(--accent); }

  .burn-counter {
    margin-top: 20px;
    padding: 20px;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    text-align: center;
  }
  .burn-counter .label { color: var(--text-3); margin-bottom: 8px; }
  .burn-counter .v {
    font-family: var(--font-mono);
    font-size: 36px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .burn-counter .sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); margin-top: 8px; }

  /* ------------------------------------ */
  /* Roadmap — numbered list               */
  /* ------------------------------------ */
  .roadmap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .phase {
    padding: 36px 32px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .phase-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 20px;
  }
  .phase-head .id {
    font-family: var(--font-mono);
    font-size: 36px;
    font-weight: 400;
    color: var(--text-4);
    letter-spacing: -0.02em;
  }
  .phase.current .phase-head .id { color: var(--accent); }
  .phase-head .status {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    border: 1px solid var(--line-strong);
    padding: 4px 8px;
    border-radius: 2px;
  }
  .phase.current .phase-head .status { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .phase h3 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .phase p { color: var(--text-2); font-size: 14px; line-height: 1.55; }

  /* ------------------------------------ */
  /* Three audiences strip                 */
  /* ------------------------------------ */
  .audiences {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .audience {
    padding: 40px 32px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 14px;
    background: var(--bg);
    transition: background .2s ease;
  }
  .audience:last-child { border-right: 0; }
  .audience:hover { background: var(--bg-2); }
  .audience .role {
    font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .audience h4 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .audience p { color: var(--text-2); font-size: 14px; line-height: 1.6; }
  .audience .audience-cta {
    margin-top: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-2);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    display: flex; justify-content: space-between;
  }
  .audience:hover .audience-cta { color: var(--accent); }

  /* ------------------------------------ */
  /* CTA banner                            */
  /* ------------------------------------ */
  .cta-banner {
    padding: 96px 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .cta-banner .grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 64px;
    align-items: end;
  }
  .cta-banner h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(40px, 5vw, 72px);
    letter-spacing: -0.03em;
    line-height: 1.0;
    text-wrap: balance;
  }
  .cta-banner h2 em { color: var(--accent); font-style: normal; }
  body[data-aesthetic="editorial"] .cta-banner h2 em { font-style: italic; }
  .cta-side { display: flex; flex-direction: column; gap: 16px; }
  .cta-side .btn { height: 48px; padding: 0 24px; font-size: 14px; }

  /* ------------------------------------ */
  /* Footer                                 */
  /* ------------------------------------ */
  footer {
    padding: 64px 0 32px;
    background: var(--bg);
  }
  .foot-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 64px;
  }
  .foot-col h5 {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 16px;
  }
  .foot-col a {
    display: block;
    font-size: 13px;
    color: var(--text-2);
    padding: 6px 0;
  }
  .foot-col a:hover { color: var(--text); }
  .foot-brand p { color: var(--text-3); font-size: 13px; margin: 12px 0; max-width: 280px; line-height: 1.5; }
  .foot-status {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px;
  }
  .foot-status .badge {
    display: inline-flex; gap: 6px; align-items: center;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--text-3); border: 1px solid var(--line);
    padding: 4px 8px; border-radius: 2px;
  }
  .foot-bottom {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  }

  /* responsive */
  @media (max-width: 980px) {
    .hero-grid, .flow, .cta-banner .grid { grid-template-columns: 1fr; gap: 48px; }
    .hero-side { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 32px; }
    .steps, .bonds-grid, .audiences, .roadmap { grid-template-columns: 1fr; }
    .audience { border-right: 0; border-bottom: 1px solid var(--line); }
    .foot-grid { grid-template-columns: 1fr 1fr; }
    .burn-feed { grid-template-columns: repeat(2, 1fr); }
  }

</style>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lumina · Operate App — Design Reference</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#1a1a1f; }
  body { font-family: 'Inter', sans-serif; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,212,255,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(0,212,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); }
  }
  input[type=range]::-webkit-slider-thumb { background: #00d4ff; }
  button { font-family: inherit; }
  em { font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="operate-app/design-canvas.jsx"></script>
<script type="text/babel" src="operate-app/operate-screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="entry" title="Entry · Role Selection" subtitle="Lands here from the landing page Launch App button">
        <DCArtboard id="role-select" label="01 · /app — Role select" width={1280} height={820}>
          <RoleSelect />
        </DCArtboard>
      </DCSection>

      <DCSection id="human" title="Human Flow" subtitle="Direct contract calls · no API · 0x7a4F…3bC8">
        <DCArtboard id="products" label="02 · /human/products — 9 shields" width={1280} height={1020}>
          <HumanProducts />
        </DCArtboard>
        <DCArtboard id="detail" label="03 · /human/products/[id] — buy flow" width={1280} height={1020}>
          <ShieldDetail />
        </DCArtboard>
        <DCArtboard id="portfolio" label="04 · /human/portfolio — policies + bonds" width={1280} height={900}>
          <Portfolio />
        </DCArtboard>
        <DCArtboard id="marketplace" label="05 · /human/marketplace — browse" width={1280} height={900}>
          <Marketplace />
        </DCArtboard>
      </DCSection>

      <DCSection id="agent" title="Agent Supervisor Flow" subtitle="Read-only dashboard · monitors a wallet operated by a bot">
        <DCArtboard id="dashboard" label="06 · /agent/dashboard — KPIs + activity" width={1280} height={960}>
          <AgentDashboard />
        </DCArtboard>
        <DCArtboard id="policies" label="07 · /agent/policies — filtered table" width={1280} height={900}>
          <AgentPolicies />
        </DCArtboard>
        <DCArtboard id="api-keys" label="08 · /agent/api-keys — key management" width={1280} height={780}>
          <AgentApiKeys />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
